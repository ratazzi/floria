[package]
name = "accessfs-fs"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
accessfs-core = { workspace = true }
accessfs-platform = { workspace = true }
accessfs-store = { workspace = true }
fuser = { workspace = true }
libc = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
ctrlc = { workspace = true }
threadpool = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
zeroize = { workspace = true }

[features]
# Typecheck-only on machines without macFUSE: makes fuser skip its pkg-config probe.
# Do NOT enable for an actual mount (the default feature probes macFUSE via libfuse2).
macos-no-mount = ["fuser/macos-no-mount"]
