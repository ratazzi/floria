[package]
name = "accessfs"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "accessfs"
path = "src/main.rs"

[dependencies]
accessfs-core = { workspace = true }
accessfs-agent = { workspace = true }
accessfs-fs = { workspace = true }
accessfs-store = { workspace = true }
accessfs-catalog = { workspace = true }
accessfs-control = { workspace = true }
accessfs-discover = { workspace = true }
accessfs-platform = { workspace = true }
accessfs-surface = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Forwarded to fuser: typecheck-only on machines without macFUSE; do not enable for real mounts.
macos-no-mount = ["accessfs-fs/macos-no-mount"]
