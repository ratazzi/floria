[package]
name = "floria"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "floria"
path = "src/main.rs"

[dependencies]
floria-core = { workspace = true }
floria-agent = { workspace = true }
floria-fs = { workspace = true }
floria-store = { workspace = true }
floria-catalog = { workspace = true }
floria-control = { workspace = true }
floria-discover = { workspace = true }
floria-platform = { workspace = true }
floria-surface = { workspace = true }
floria-backup = { workspace = true }
floria-integrity = { workspace = true }
floria-replication = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
ssh-key = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Forwarded to fuser: typecheck-only on machines without macFUSE; do not enable for real mounts.
macos-no-mount = ["floria-fs/macos-no-mount"]
