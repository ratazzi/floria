name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run project checks
        run: mise run ci
