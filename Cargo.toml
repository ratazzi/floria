[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ratazzi/floria"

[workspace.dependencies]
fuser = "0.17"
libproc = "0.14"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
dashmap = "6"
globset = "0.4"
humantime = "2"
clap = { version = "4", features = ["derive"] }
wait-timeout = "0.2"
ctrlc = { version = "3", features = ["termination"] }
threadpool = "1"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"], default-features = false }
age = { version = "0.10", features = ["ssh"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
notify = "8.2"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
signature = "2"
rsa = "0.9.10"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom", "p256", "p384", "p521", "rsa"] }
security-framework = "3"

floria-core = { path = "crates/floria-core" }
floria-platform = { path = "crates/floria-platform" }
floria-agent = { path = "crates/floria-agent" }
floria-fs = { path = "crates/floria-fs" }
floria-store = { path = "crates/floria-store" }
floria-catalog = { path = "crates/floria-catalog" }
floria-control = { path = "crates/floria-control" }
floria-discover = { path = "crates/floria-discover" }
floria-surface = { path = "crates/floria-surface" }
floria-ssh = { path = "crates/floria-ssh" }
floria-backup = { path = "crates/floria-backup" }
