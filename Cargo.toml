[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ratazzi/floria"

[workspace.dependencies]
fuser = "0.17"
libproc = "0.14"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
dashmap = "6"
globset = "0.4"
humantime = "2"
clap = { version = "4", features = ["derive"] }
wait-timeout = "0.2"
ctrlc = "3"
threadpool = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"], default-features = false }
age = { version = "0.10", features = ["ssh"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }

accessfs-core = { path = "crates/accessfs-core" }
accessfs-platform = { path = "crates/accessfs-platform" }
accessfs-agent = { path = "crates/accessfs-agent" }
accessfs-fs = { path = "crates/accessfs-fs" }
accessfs-store = { path = "crates/accessfs-store" }
accessfs-catalog = { path = "crates/accessfs-catalog" }
accessfs-control = { path = "crates/accessfs-control" }
