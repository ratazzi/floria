[tools]
rust = "1.97.1"

[tasks.generate-icons]
description = "Generate the macOS app and menu-bar icons from the checked-in source image"
run = "uv run --with pillow python scripts/generate-app-icons.py app/Assets/FloriaIconSource.png app/Assets"

[tasks.generate-dmg-background]
description = "Generate the checked-in installer background"
run = "uv run --with pillow python scripts/generate-dmg-background.py app/Assets/DmgBackground.png"

[tasks.build-app]
description = "Build and sign Floria.app without installing or launching it"
depends = ["check-rust-fixtures"]
run = "scripts/build-app"

[tasks.install-app]
description = "Build a CloudKit-enabled Floria.app and install it in /Applications"
depends = ["check-rust-fixtures"]
run = "FLORIA_INSTALL_VARIANT=cloudkit scripts/install-app"

[tasks.install-development-app]
description = "Explicitly replace Floria.app with an ad-hoc build without CloudKit"
depends = ["check-rust-fixtures"]
run = "FLORIA_INSTALL_VARIANT=development FLORIA_ALLOW_CLOUDKIT_DOWNGRADE=1 scripts/install-app"

[tasks.package-dmg]
description = "Build, sign, package, and verify a Floria DMG without overwriting an existing image"
depends = ["check-rust-fixtures"]
run = "scripts/package-dmg"

[tasks.notarize-dmg]
description = "Submit a Developer ID-signed DMG using a notarytool Keychain profile"
run = "scripts/notarize-dmg"
raw = true

[tasks.smoke-app]
description = "Verify the currently installed Floria.app without rebuilding or replacing it"
run = "scripts/smoke-daemon-recovery"

[tasks.check-rust-fixtures]
description = "Reject credential-shaped values from source and test fixtures"
run = '''
set -euo pipefail

PATTERN='(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|A(KIA|SIA)[0-9A-Z]{16}|glpat-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|-----BEGIN ([A-Z ]+)?PRIVATE KEY-----|postgres(ql)?://[A-Za-z0-9._~-]+:[^@[:space:]]+@|"[^"[:space:]:]+:[0-9*]+:[^"[:space:]:]+:[^"[:space:]:]+:[^"[:space:]:]+(\\n)?")'

if rg --files-with-matches --glob '*.{rs,swift}' "$PATTERN" crates app; then
    echo "Credential-shaped value found in source; assemble structured fixture values at runtime instead."
    exit 1
fi

echo "Source fixtures contain no credential-shaped values"
'''
